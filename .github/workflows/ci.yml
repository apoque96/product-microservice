name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    env:
      SPRING_PROFILES_ACTIVE: test

    runs-on: ubuntu-latest
    
    steps:
    # Etapa 1: Checkout - Descargar el código del repositorio en el runner
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necesario para SonarQube
    
    # Etapa 2: Setup del entorno - Preparar el runtime del lenguaje
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    # Etapa 3: Instalación de dependencias - Instalar paquetes necesarios
    - name: Install dependencies
      run: mvn clean install -DskipTests
    
    # Etapa 4: Pruebas unitarias - Ejecutar las pruebas del sistema
    - name: Run unit tests
      run: mvn test
    
    # Generar reporte de cobertura para SonarQube
    - name: Generate test coverage report
      run: mvn jacoco:report
      
    # Etapa 5: Análisis estático - Ejecutar lint o análisis equivalente
    - name: Run static code analysis (PMD)
      run: mvn pmd:check
    
    # Etapa 6: SonarQube Cloud Scan - Enviar resultados al análisis de SonarQube Cloud
    - name: SonarQube Cloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn verify sonar:sonar \
          -Dsonar.projectKey=apoque96_product-microservice \
          -Dsonar.organization=apoque96 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -Dsonar.java.binaries=target/classes \
          -Dsonar.java.test.binaries=target/test-classes